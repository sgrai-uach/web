# version explícita: el servidor tiene un Compose viejo que la exige.
# (Compose v2 moderno la ignora con un warning inofensivo.)
version: "3.8"

services:
  grupo1_frontend:
    image: ghcr.io/sgrai-uach/web:latest
    container_name: grupo1_frontend
    restart: unless-stopped
    env_file: .env
    networks:
      - red_taller_software

networks:
  red_taller_software:
    external: true
