services:
  grupo1_frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL
        - NEXT_PUBLIC_SOCKET_URL
    container_name: grupo1_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - red_taller_software

networks:
  red_taller_software:
    driver: bridge
